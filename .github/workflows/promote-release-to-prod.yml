name: Promote Release to PROD

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release snapshot to publish, e.g. brenalia-2026-10-01"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to confirm production release"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "PUBLISH" ]; then
            echo "Production promotion cancelled: confirm must equal PUBLISH."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842788974108:role/mar-github-deploy
          aws-region: ap-southeast-1

      - name: Verify release snapshot exists
        shell: bash
        run: |
          COUNT=$(aws s3api list-objects-v2             --bucket mar-tripletsuniverse-web-releases             --prefix "${{ inputs.release_name }}/"             --max-items 1             --query 'KeyCount'             --output text)

          if [ "$COUNT" = "0" ]; then
            echo "Release snapshot does not exist."
            exit 1
          fi

      - name: Promote frozen release to PROD
        run: |
          aws s3 sync             s3://mar-tripletsuniverse-web-releases/${{ inputs.release_name }}/             s3://mar-tripletsuniverse-web-prod             --delete             --exclude "_release-manifest.txt"

      - name: Invalidate PROD CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2WMH6XYHSEFZW --paths "/*"

      - name: Show published release
        run: echo "Published release: ${{ inputs.release_name }}"
