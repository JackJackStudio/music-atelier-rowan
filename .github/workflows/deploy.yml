name: Build and Deploy PROD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842788974108:role/mar-github-deploy
          aws-region: ap-southeast-1

      - name: Add clean URL objects
        run: |
          find out -type f -name index.html | while read file; do
            rel="${file#out/}"
            dir="${rel%/index.html}"
            if [ "$dir" != "$rel" ] && [ -n "$dir" ]; then
              cp "$file" "out/$dir.__cleanurl"
            fi
          done

      - name: Upload to PROD S3
        run: |
          aws s3 sync out/ s3://mar-tripletsuniverse-web-prod --delete --exclude "*.__cleanurl"
          find out -type f -name "*.__cleanurl" | while read file; do
            key="${file#out/}"
            key="${key%.__cleanurl}"
            aws s3 cp "$file" "s3://mar-tripletsuniverse-web-prod/$key" --content-type "text/html; charset=utf-8" --cache-control "public,max-age=0,must-revalidate"
          done

      - name: Invalidate PROD CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2WMH6XYHSEFZW --paths "/*"
