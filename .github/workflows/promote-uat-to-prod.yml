name: Promote UAT to PROD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842788974108:role/mar-github-deploy
          aws-region: ap-southeast-1

      - name: Show release source
        run: |
          echo "Promoting the already-tested UAT artifact to PROD"
          echo "Source: s3://mar-tripletsuniverse-web-uat"
          echo "Target: s3://mar-tripletsuniverse-web-prod"

      - name: Promote UAT artifact to PROD
        run: aws s3 sync s3://mar-tripletsuniverse-web-uat s3://mar-tripletsuniverse-web-prod --delete

      - name: Invalidate PROD CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2WMH6XYHSEFZW --paths "/*"
