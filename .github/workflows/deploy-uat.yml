name: Deploy UAT

on:
  workflow_dispatch:
  push:
    branches:
      - uat

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842788974108:role/mar-github-deploy
          aws-region: ap-southeast-1

      - name: Upload to UAT S3
        run: aws s3 sync out/ s3://mar-tripletsuniverse-web-uat --delete

      - name: Invalidate UAT CloudFront
        run: aws cloudfront create-invalidation --distribution-id E31050AWJ8E99Q --paths "/*"
